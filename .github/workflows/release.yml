name: Publish Package
on:
    release:
        types: [published]
jobs:
    build:
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v5
            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: bun install --frozen-lockfile
            # build before npm reads package.json, or it drops the bin entries pointing into dist/
            - run: bun run build
            # bun publish cannot generate provenance statements, so publish with npm.
            # npm uses trusted publishing (OIDC) when configured on npmjs.com, else NODE_AUTH_TOKEN.
            - run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
